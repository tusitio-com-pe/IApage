<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Álbum Virtual | Efraín Fotografía</title>
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../../images/logo.svg">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Lato"', 'sans-serif'],
                    },
                    colors: {
                        'off-white': '#f9f9f9',
                        'charcoal': '#1a1a1a',
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #ffffff; color: #1a1a1a; }
        
        .fade-in-section {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            will-change: opacity, transform;
        }
        
        .fade-in-section.is-visible { opacity: 1; transform: translateY(0); }

        /* REJILLA ESTILO INSTAGRAM / SEMI-VERTICAL */
        .instagram-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            grid-auto-flow: dense;
        }

        @media (max-width: 1024px) {
            .instagram-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 768px) {
            .instagram-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }
        }

        .grid-item {
            position: relative;
            aspect-ratio: 3 / 4; 
            overflow: hidden;
            background-color: #f3f3f3;
            border-radius: 2px;
        }

        /* Ocupa 2 columnas si es horizontal */
        .grid-item.is-horizontal {
            grid-column: span 2;
            aspect-ratio: 16 / 10;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: zoom-in;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            display: block;
            opacity: 0;
            transition: opacity 0.4s ease-in;
        }

        .grid-item img.loaded {
            opacity: 1;
        }

        .image-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.4), transparent);
        }

        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background-color: rgba(0,0,0,0.95);
            align-items: center;
            justify-content: center;
        }
        #lightbox.open { display: flex; }

        .whatsapp-float-btn {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        /* Tooltip de copiado */
        #toast {
            visibility: hidden;
            min-width: 200px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 2px;
            padding: 12px;
            position: fixed;
            z-index: 200;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 1px;
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body class="antialiased font-sans">

    <!-- Navegación -->
    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center text-charcoal">
            <a href="#" class="font-serif text-2xl tracking-[0.2em] font-bold uppercase">Efraín</a>
            <div class="hidden md:flex items-center space-x-8 text-[11px] tracking-[0.2em] uppercase font-bold">
                <a href="#galeria-inicio" class="hover:text-gray-400 transition-colors">Galería</a>
                <a href="https://wa.me/51955073778" target="_blank" class="bg-black text-white px-6 py-3 hover:bg-gray-800 transition-all">Contacto</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="relative h-[70vh] flex items-center justify-center overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img id="hero-bg" src="" class="w-full h-full object-cover brightness-[0.4]">
        </div>
        
        <div class="relative z-10 text-center text-white px-4 fade-in-section is-visible">
            <p class="text-[10px] tracking-[0.5em] uppercase mb-4 opacity-80">Wedding Gallery</p>
            <h1 id="couple-name" class="font-serif text-5xl md:text-7xl mb-4 leading-tight">Cargando...</h1>
            <p id="wedding-date" class="font-light text-sm md:text-base tracking-[0.2em] text-gray-300"></p>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main id="galeria-inicio" class="bg-white py-12">
        <div id="gallery-wrapper" class="max-w-[1400px] mx-auto px-4 md:px-6">
            <!-- Las secciones se inyectan aquí -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-charcoal text-white py-16 border-t border-white/5">
        <div class="max-w-7xl mx-auto px-6 text-center">
            <p class="font-serif text-2xl tracking-widest mb-4">Efraín Balceda</p>
            <p class="text-[9px] text-gray-500 uppercase tracking-[0.4em]">Fotografía Profesional</p>
            <div class="h-px w-12 bg-gray-800 mx-auto my-8"></div>
            <p class="text-[9px] text-gray-600 uppercase tracking-widest">© 2026 — Lima, Perú</p>
        </div>
    </footer>

    <!-- Toast de Notificación -->
    <div id="toast">Enlace copiado al portapapeles</div>

    <!-- WhatsApp -->
    <div class="fixed bottom-8 right-8 z-[60]">
        <a href="https://wa.me/51955073778" target="_blank" class="whatsapp-float-btn bg-[#25D366] text-white p-4 rounded-full flex items-center justify-center hover:scale-110 transition-transform">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        </a>
    </div>

    <!-- Lightbox -->
    <div id="lightbox">
        <!-- Controles Superiores -->
        <div class="absolute top-0 left-0 right-0 p-6 flex justify-between items-center z-[110]">
            <div class="flex space-x-4">
                <button id="lb-download" class="text-white/70 hover:text-white transition-colors bg-white/10 p-2 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                </button>
                <button id="lb-share" class="text-white/70 hover:text-white transition-colors bg-white/10 p-2 rounded-full">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                </button>
            </div>
            <button onclick="closeLightbox()" class="text-white/70 hover:text-white transition-colors p-2 bg-white/10 rounded-full">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <button id="prev-btn" onclick="prevImg(event)" class="absolute left-4 text-white/40 hover:text-white p-4 z-[110]">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </button>
        <button id="next-btn" onclick="nextImg(event)" class="absolute right-4 text-white/40 hover:text-white p-4 z-[110]">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </button>
        
        <div class="max-w-7xl max-h-[90vh] p-4 flex items-center justify-center" onclick="event.target === this && closeLightbox()">
            <img id="lightbox-img" src="" class="max-w-full max-h-[85vh] object-contain shadow-2xl transition-opacity duration-300">
        </div>
    </div>

    <script>
        // CONFIGURACIÓN R2
        const R2_URL = "https://cdn.tusitio.com.pe"; 
        const CLIENTE_PATH = "bodas/2026/gilson"; 

        const weddingConfig = {
            names: "Gilson & Ana",
            date: "FEBRERO 2026",
            coverImage: `${R2_URL}/${CLIENTE_PATH}/portada.jpg`,
            sections: [
                { id: "salon", title: "Consejo Matrimonial", prefix: "gilson-sr-", count: 167 },
                { id: "sesion", title: "Sesión Nupcial", prefix: "gilson-sesion-", count: 19 },
                { id: "recepcion", title: "Fiesta y Recepción", prefix: "gilson-recepcion-", count: 384 }
            ]
        };

        const allImagesData = [];
        let currentIndex = 0;

        window.onload = () => {
            renderGallery();
            setupObservers();
        };

        function renderGallery() {
            document.getElementById('couple-name').innerText = weddingConfig.names;
            document.getElementById('wedding-date').innerText = weddingConfig.date;
            document.getElementById('hero-bg').src = weddingConfig.coverImage;

            const wrapper = document.getElementById('gallery-wrapper');
            
            weddingConfig.sections.forEach(section => {
                const sectionEl = document.createElement('section');
                sectionEl.id = section.id;
                sectionEl.className = "pt-20 fade-in-section";
                
                let photosHtml = "";
                for (let i = 1; i <= section.count; i++) {
                    const url = `${R2_URL}/${CLIENTE_PATH}/${section.id}/${section.prefix}${i}.jpg`;
                    allImagesData.push(url);
                    photosHtml += `
                        <div class="grid-item group">
                            <img src="${url}" 
                                 loading="lazy" 
                                 onload="onImgLoad(this)" 
                                 onerror="this.parentElement.style.display='none'"
                                 onclick="openLightbox('${url}')">
                            
                            <div class="absolute inset-0 image-overlay opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none flex flex-col justify-end p-4">
                                <div class="flex justify-between items-center pointer-events-auto">
                                    <button onclick="downloadImage('${url}')" class="text-white/90 hover:text-white p-2">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                    </button>
                                    <button onclick="shareImage('${url}')" class="text-white/90 hover:text-white p-2">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                }

                sectionEl.innerHTML = `
                    <div class="mb-12 text-center">
                        <h2 class="font-serif text-3xl text-charcoal tracking-wide">${section.title}</h2>
                        <div class="h-0.5 w-8 bg-black/10 mx-auto my-4"></div>
                        <p class="text-[9px] text-gray-400 uppercase tracking-[0.3em] font-bold">${section.count} fotografías</p>
                    </div>
                    <div class="instagram-grid">
                        ${photosHtml}
                    </div>
                `;
                wrapper.appendChild(sectionEl);
            });
        }

        function onImgLoad(img) {
            img.classList.add('loaded');
            if (img.naturalWidth > img.naturalHeight) {
                img.parentElement.classList.add('is-horizontal');
            }
        }

        // --- FUNCIONES CORE ---

        async function downloadImage(url) {
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = url.split('/').pop();
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(blobUrl);
            } catch (error) {
                window.open(url, '_blank');
            }
        }

        function shareImage(url) {
            if (navigator.share) {
                navigator.share({
                    title: 'Boda Gilson & Ana',
                    text: 'Mira esta foto de la galería',
                    url: url
                }).catch(() => copyToClipboard(url));
            } else {
                copyToClipboard(url);
            }
        }

        function copyToClipboard(text) {
            const input = document.createElement('input');
            input.value = text;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }

        // --- LIGHTBOX ---

        function openLightbox(src) {
            currentIndex = allImagesData.indexOf(src);
            const lb = document.getElementById('lightbox');
            const lbImg = document.getElementById('lightbox-img');
            
            lbImg.src = src;
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';

            // Vincular botones del lightbox
            document.getElementById('lb-download').onclick = () => downloadImage(allImagesData[currentIndex]);
            document.getElementById('lb-share').onclick = () => shareImage(allImagesData[currentIndex]);
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('open');
            document.body.style.overflow = '';
        }

        function nextImg(e) {
            e.stopPropagation();
            currentIndex = (currentIndex + 1) % allImagesData.length;
            updateLightboxContent();
        }

        function prevImg(e) {
            e.stopPropagation();
            currentIndex = (currentIndex - 1 + allImagesData.length) % allImagesData.length;
            updateLightboxContent();
        }

        function updateLightboxContent() {
            const lbImg = document.getElementById('lightbox-img');
            lbImg.style.opacity = '0';
            setTimeout(() => {
                lbImg.src = allImagesData[currentIndex];
                lbImg.style.opacity = '1';
            }, 100);
        }

        function setupObservers() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('is-visible');
                });
            }, { threshold: 0.1 });
            document.querySelectorAll('.fade-in-section').forEach(s => observer.observe(s));
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('open')) return;
            if (e.key === "ArrowRight") nextImg(e);
            if (e.key === "ArrowLeft") prevImg(e);
            if (e.key === "Escape") closeLightbox();
        });
    </script>
</body>
</html>
